<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Verification | Roblox x Discord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #313338; color: #dbdee1; }
        .discord-card { background-color: #2b2d31; border: 1px solid #1f2023; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
        .input-dark { background-color: #1e1f22; border: 1px solid transparent; color: #dbdee1; }
        .input-dark:focus { border-color: #5865f2; outline: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full discord-card rounded-2xl p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#5865f2] via-[#00b0f4] to-[#23a55a]"></div>

        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#5865f2] text-white shadow-lg mb-3">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">Server Verification</h1>
            <p class="text-sm text-[#949ba4] mt-1">Link your Roblox account to gain access to channels.</p>
        </div>

        <!-- Step 1 -->
        <div id="step-1" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[#949ba4] mb-2">Roblox Username</label>
                <input type="text" id="roblox-username" placeholder="Enter your exact username" class="w-full px-4 py-3 rounded-lg input-dark text-sm placeholder-[#87898c]">
            </div>
            <button onclick="startVerification()" id="lookup-btn" class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white font-medium py-3 rounded-lg transition duration-200 shadow-md">
                Continue
            </button>
        </div>

        <!-- Step 2 -->
        <div id="step-2" class="hidden space-y-4">
            <div class="bg-[#1e1f22] p-4 rounded-xl border border-[#35363c]">
                <div class="flex items-center space-x-3 mb-3">
                    <img id="user-avatar" src="" alt="Avatar" class="w-12 h-12 rounded-full bg-[#2b2d31]">
                    <div>
                        <div id="display-name" class="font-bold text-white text-sm"></div>
                        <div id="username-tag" class="text-xs text-[#949ba4]"></div>
                    </div>
                </div>
                <p class="text-xs text-[#949ba4] leading-relaxed mb-3">
                    Paste this security code anywhere into your Roblox profile <strong class="text-white">About</strong> section, then click verify.
                </p>
                <div class="bg-[#2b2d31] p-2.5 rounded-lg flex items-center justify-between border border-[#3f4147]">
                    <code id="verification-code" class="text-emerald-400 font-mono font-bold text-sm tracking-widest"></code>
                    <button onclick="copyCode()" class="text-xs bg-[#35363c] hover:bg-[#404249] text-white px-2.5 py-1.5 rounded transition">Copy</button>
                </div>
            </div>
            <button onclick="verifyAccount()" id="verify-btn" class="w-full bg-[#23a55a] hover:bg-[#1f8c4c] text-white font-medium py-3 rounded-lg transition duration-200 shadow-md">
                I've updated my bio, Verify Me!
            </button>
            <button onclick="resetFlow()" class="w-full text-xs text-[#949ba4] hover:underline mt-1 text-center">Use a different account</button>
        </div>

        <!-- Step 3 -->
        <div id="step-3" class="hidden text-center space-y-4 py-4">
            <div class="w-16 h-16 bg-[#23a55a]/20 text-[#23a55a] rounded-full flex items-center justify-center mx-auto mb-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-xl font-bold text-white">Successfully Verified!</h2>
            <p class="text-sm text-[#949ba4]">Your identity has been logged to the server database. You can now chat in the server.</p>
        </div>

        <div id="error-msg" class="hidden mt-4 p-3 bg-[#f23f43]/10 border border-[#f23f43]/30 rounded-lg text-xs text-[#f23f43] text-center"></div>
    </div>

    <script>
        let generatedCode = '';
        let currentUserId = '';
        let currentUsername = '';
        let currentDisplayName = '';

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'RBX-';
            for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        async function startVerification() {
            const usernameInput = document.getElementById('roblox-username').value.trim();
            const errorDiv = document.getElementById('error-msg');
            const lookupBtn = document.getElementById('lookup-btn');
            errorDiv.classList.add('hidden');

            if (!usernameInput) return showError('Please enter your Roblox username.');

            lookupBtn.disabled = true;
            lookupBtn.textContent = 'Searching Roblox API...';

            try {
                const res = await fetch(`https://users.roblox.com/v1/usernames/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usernames: [usernameInput], excludeBannedUsers: true })
                });
                const data = await res.json();
                if (!data.data || data.data.length === 0) throw new Error('Roblox user not found.');

                const user = data.data[0];
                currentUserId = user.id;
                currentUsername = user.name;
                currentDisplayName = user.displayName;

                const avatarRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${currentUserId}&size=150x150&format=Png&isCircular=false`);
                const avatarData = await avatarRes.json();
                document.getElementById('user-avatar').src = avatarData.data[0]?.imageUrl || '';

                document.getElementById('display-name').textContent = currentDisplayName;
                document.getElementById('username-tag').textContent = `@${currentUsername} (ID: ${currentUserId})`;
                
                generatedCode = generateCode();
                document.getElementById('verification-code').textContent = generatedCode;

                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
            } catch (err) {
                showError(err.message || 'Failed to connect to Roblox.');
                lookupBtn.disabled = false;
                lookupBtn.textContent = 'Continue';
            }
        }

        async function verifyAccount() {
            const verifyBtn = document.getElementById('verify-btn');
            const errorDiv = document.getElementById('error-msg');
            errorDiv.classList.add('hidden');
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Checking profile bio...';

            try {
                const profileRes = await fetch(`https://users.roblox.com/v1/users/${currentUserId}`);
                const profileData = await profileRes.json();
                const bio = profileData.description || '';

                if (!bio.includes(generatedCode)) throw new Error('Security code not found in your Roblox bio yet!');

                // Calls our secure backend function endpoint
                const backendRes = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, displayName: currentDisplayName, userId: currentUserId })
                });

                if (!backendRes.ok) throw new Error('Failed to record verification on the backend server.');

                document.getElementById('step-2').classList.add('hidden');
                document.getElementById('step-3').classList.remove('hidden');
            } catch (err) {
                showError(err.message);
                verifyBtn.disabled = false;
                verifyBtn.textContent = "I've updated my bio, Verify Me!";
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(generatedCode);
            const btn = event.target;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 2000);
        }

        function resetFlow() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
            document.getElementById('lookup-btn').disabled = false;
            document.getElementById('lookup-btn').textContent = 'Continue';
            document.getElementById('roblox-username').value = '';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
